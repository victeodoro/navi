# Navi: the screen never blanks or powers off on its own, at the login screen
# or in the session (xfce-settings.sh turns off XFCE's own timers too).
# Lock it on demand with Super+L. Takes effect when X restarts.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
