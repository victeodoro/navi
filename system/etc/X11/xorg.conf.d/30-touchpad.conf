# Navi: tap to click on every touchpad (libinput leaves it off by default).
# Also covers the login screen. Takes effect when X restarts (log out and in).
Section "InputClass"
    Identifier      "Navi touchpad"
    MatchIsTouchpad "on"
    MatchDriver     "libinput"
    Option          "Tapping"          "on"    # 1 finger = left, 2 = right, 3 = middle
    Option          "TappingDragLock"  "off"
    Option          "ScrollMethod"     "twofinger"   # two-finger scroll, everywhere
EndSection
