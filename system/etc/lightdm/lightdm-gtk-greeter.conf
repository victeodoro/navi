# Navi: login screen (LightDM GTK greeter). Installed by bootstrap.sh.
# The greeter runs as the "lightdm" user, so everything it uses must live
# outside $HOME: wallpaper in /usr/share/backgrounds/navi, theme in /usr/share/themes.
[greeter]
background = /usr/share/backgrounds/navi/lain.png
user-background = false
theme-name = Navi-Greeter
icon-theme-name = Adwaita
font-name = JetBrains Mono 11
hide-user-image = true
position = 50%,center 55%,center
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %a %d %b  %H:%M
