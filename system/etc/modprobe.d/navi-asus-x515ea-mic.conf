# Navi: ASUS VivoBook X515EA internal microphone.
# The kernel's ASUS quirk marks codec pin 0x13 as the internal mic, but nothing
# is wired there on this model (it records pure zeros). The BIOS correctly says
# the mic is analog on pin 0x1b. The patch file sets 0x13 back to "unused", so
# the driver records from 0x1b. Installed by scripts/system.sh only on this codec.
options snd-hda-intel patch=navi/asus-x515ea-mic.fw
