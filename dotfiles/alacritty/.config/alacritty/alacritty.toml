# Navi: Alacritty, Gruvbox dark

[env]
# Many remote hosts don't know TERM=alacritty; this avoids broken
# terminals when SSHing into boxes you don't control.
TERM = "xterm-256color"

[window]
padding = { x = 12, y = 10 }
dynamic_padding = true

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[cursor]
style = { shape = "Beam", blinking = "On" }

# Gruvbox dark
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
