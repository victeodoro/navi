# Navi: Alacritty, Gruvbox dark

[env]
# Many remote hosts don't know TERM=alacritty; this avoids broken
# terminals when SSHing into boxes you don't control.
TERM = "xterm-256color"

[window]
dimensions = { columns = 70, lines = 18 }
padding = { x = 16, y = 14 }
dynamic_padding = true
opacity = 0.98          # xfwm4 makes this look much stronger than it sounds; 0.95 was too see-through
decorations = "Full"

[font]
size = 11.0
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[cursor]
style = { shape = "Beam", blinking = "On" }

# Gruvbox dark
[colors.primary]
background = "#1d2021"   # Gruvbox hard: a touch deeper than #282828
foreground = "#ebdbb2"

[colors.cursor]
cursor = "#fe8019"
text   = "#1d2021"

[colors.selection]
background = "#d65d0e"
text       = "#1d2021"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
